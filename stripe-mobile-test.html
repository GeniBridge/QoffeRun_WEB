<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Stripe Connect Mobile Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 20px 10px;
        }

        .test-container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .test-section {
            padding: 20px;
        }

        .test-card {
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            background: #f8f9ff;
        }

        .test-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            margin-bottom: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-primary { background: #007bff; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-warning { background: #ffc107; color: #000; }
        .btn-danger { background: #dc3545; color: white; }
        .btn-info { background: #17a2b8; color: white; }

        .test-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .result {
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 14px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .result.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #b8daff;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        .status-online { background: #28a745; }
        .status-offline { background: #dc3545; }
        .status-pending { background: #ffc107; }

        .loading {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #007bff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .stripe-form {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e0e0e0;
            margin-top: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-label {
            font-weight: 600;
            margin-bottom: 5px;
            display: block;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
        }

        .order-summary {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .order-item {
            display: flex;
            justify-content: between;
            margin-bottom: 8px;
            padding-bottom: 8px;
            border-bottom: 1px dashed #dee2e6;
        }

        .order-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e9ecef;
            border-radius: 3px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #28a745, #20c997);
            width: 0%;
            transition: width 0.5s ease;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <div class="header">
            <h3><i class="bi bi-credit-card-2-front"></i> Stripe Connect Test</h3>
            <p class="mb-0">Mobile Payment Testing Dashboard</p>
        </div>

        <!-- System Status -->
        <div class="test-section">
            <div class="test-card">
                <h6><i class="bi bi-activity"></i> System Status</h6>
                <div id="systemStatus">
                    <div class="loading"></div> Checking connection...
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <!-- Branch Selection -->
            <div class="test-card">
                <h6><i class="bi bi-shop"></i> Test Branch</h6>
                <select id="branchSelect" class="form-control">
                    <option value="">Loading branches...</option>
                </select>
                <div id="branchInfo" style="margin-top: 10px; font-size: 14px; color: #6c757d;"></div>
            </div>

            <!-- Test Scenarios -->
            <div class="test-card">
                <h6><i class="bi bi-list-check"></i> Test Scenarios</h6>
                
                <button class="test-button btn-primary" onclick="testStripeConnection()">
                    <i class="bi bi-link-45deg"></i> Test Stripe Connection
                </button>
                
                <button class="test-button btn-success" onclick="testPaymentFlow()">
                    <i class="bi bi-credit-card"></i> Test Payment Flow
                </button>
                
                <button class="test-button btn-warning" onclick="testRefundFlow()">
                    <i class="bi bi-arrow-return-left"></i> Test Refund Process
                </button>
                
                <button class="test-button btn-info" onclick="testWebhookFlow()">
                    <i class="bi bi-arrow-left-right"></i> Test Webhooks
                </button>
                
                <button class="test-button btn-danger" onclick="runFullStripeTest()">
                    <i class="bi bi-lightning-fill"></i> Complete Stripe Test
                </button>

                <div id="testResults"></div>
            </div>

            <!-- Mock Order -->
            <div class="test-card" style="display: none;" id="orderSection">
                <h6><i class="bi bi-cart"></i> Test Order</h6>
                <div class="order-summary">
                    <div class="order-item">
                        <span>Cappuccino (Large)</span>
                        <span style="margin-left: auto;">€3.50</span>
                    </div>
                    <div class="order-item">
                        <span>Cornetto</span>
                        <span style="margin-left: auto;">€2.00</span>
                    </div>
                    <div class="order-item">
                        <span><strong>Total</strong></span>
                        <span style="margin-left: auto;"><strong>€5.50</strong></span>
                    </div>
                </div>

                <div class="stripe-form">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="customerEmail" value="test@example.com">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label">Card Information</label>
                        <div id="card-element" style="padding: 12px; border: 1px solid #ddd; border-radius: 6px;">
                            <!-- Stripe Elements will create form elements here -->
                        </div>
                    </div>

                    <button class="test-button btn-success" id="payButton" onclick="processPayment()">
                        <i class="bi bi-lock-fill"></i> Pay €5.50
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let stripe = null;
        let elements = null;
        let cardElement = null;
        let branches = [];
        let selectedBranch = null;

        // Initialize
        document.addEventListener('DOMContentLoaded', async function() {
            await initializeSystem();
            updateProgress(20);
            
            await loadBranches();
            updateProgress(50);
            
            await initializeStripe();
            updateProgress(100);
        });

        async function initializeSystem() {
            const statusDiv = document.getElementById('systemStatus');
            
            try {
                const response = await fetch('https://api.qofferun.com/api/v1/public/branches');
                const data = await response.json();
                
                if (data.success) {
                    statusDiv.innerHTML = `
                        <div><span class="status-indicator status-online"></span>API: Online</div>
                        <div><span class="status-indicator status-online"></span>Branches: ${data.data.length} active</div>
                        <div><span class="status-indicator status-online"></span>Ready for testing</div>
                    `;
                } else {
                    throw new Error('API Error');
                }
            } catch (error) {
                statusDiv.innerHTML = `
                    <div><span class="status-indicator status-offline"></span>API: Offline</div>
                    <div><span class="status-indicator status-offline"></span>Error: ${error.message}</div>
                `;
            }
        }

        async function loadBranches() {
            try {
                const response = await fetch('https://api.qofferun.com/api/v1/public/branches');
                const data = await response.json();
                
                if (data.success) {
                    branches = data.data;
                    const select = document.getElementById('branchSelect');
                    select.innerHTML = '<option value="">Select a branch...</option>';
                    
                    branches.forEach(branch => {
                        const option = document.createElement('option');
                        option.value = branch.id;
                        option.textContent = branch.name;
                        select.appendChild(option);
                    });

                    select.onchange = function() {
                        selectedBranch = branches.find(b => b.id == this.value);
                        updateBranchInfo();
                    };
                    
                    // Auto-select first branch
                    if (branches.length > 0) {
                        select.value = branches[0].id;
                        selectedBranch = branches[0];
                        updateBranchInfo();
                    }
                }
            } catch (error) {
                console.error('Failed to load branches:', error);
            }
        }

        function updateBranchInfo() {
            const infoDiv = document.getElementById('branchInfo');
            if (selectedBranch) {
                const stripeStatus = selectedBranch.has_stripe_account ? '✅ Connected' : '❌ Not Connected';
                infoDiv.innerHTML = `
                    <div>Products: ${selectedBranch.products_count}</div>
                    <div>Stripe: ${stripeStatus}</div>
                    <div>Address: ${selectedBranch.address}</div>
                `;
            }
        }

        function updateProgress(percentage) {
            document.getElementById('progressFill').style.width = percentage + '%';
        }

        async function initializeStripe() {
            try {
                // Initialize Stripe with your publishable key
                // Note: You'll need to replace this with your actual publishable key
                stripe = Stripe('pk_test_51QD8VhRqFxYzKoFNjWXfQ2oJhHKLEzYXyRhBNVQGI5oGgKJXlOmUYCUBDYZGgKEfqKYvLYoG6WXaRjHgKzPQQbqF00CgBJZGhK');
                
                elements = stripe.elements();
                cardElement = elements.create('card', {
                    style: {
                        base: {
                            fontSize: '16px',
                            color: '#424770',
                            '::placeholder': {
                                color: '#aab7c4',
                            },
                        },
                    },
                });
                
                cardElement.mount('#card-element');
                
                showResult('info', 'Stripe initialized successfully');
            } catch (error) {
                showResult('error', 'Failed to initialize Stripe: ' + error.message);
            }
        }

        // Test Functions
        async function testStripeConnection() {
            if (!selectedBranch) {
                showResult('error', 'Please select a branch first');
                return;
            }

            showResult('info', 'Testing Stripe connection...');
            
            try {
                // Test the branch's Stripe account status
                const response = await fetch(`https://api.qofferun.com/api/v1/public/branches/${selectedBranch.id}`);
                const data = await response.json();
                
                if (data.success && data.data.branch.has_stripe_account) {
                    showResult('success', `✅ Stripe Connect active for ${selectedBranch.name}`);
                } else {
                    showResult('error', `❌ Stripe Connect not configured for ${selectedBranch.name}`);
                }
            } catch (error) {
                showResult('error', 'Connection test failed: ' + error.message);
            }
        }

        function testPaymentFlow() {
            if (!selectedBranch || !selectedBranch.has_stripe_account) {
                showResult('error', 'Please select a branch with Stripe Connect enabled');
                return;
            }

            document.getElementById('orderSection').style.display = 'block';
            showResult('info', 'Payment form ready. Use test card: 4242424242424242');
        }

        async function processPayment() {
            if (!stripe || !cardElement) {
                showResult('error', 'Stripe not initialized');
                return;
            }

            const payButton = document.getElementById('payButton');
            payButton.innerHTML = '<div class="loading"></div> Processing...';
            payButton.disabled = true;

            try {
                // Create payment method
                const {error, paymentMethod} = await stripe.createPaymentMethod({
                    type: 'card',
                    card: cardElement,
                    billing_details: {
                        email: document.getElementById('customerEmail').value,
                    },
                });

                if (error) {
                    throw error;
                }

                // Simulate successful payment
                setTimeout(() => {
                    showResult('success', `✅ Payment successful! Payment Method: ${paymentMethod.id}`);
                    payButton.innerHTML = '<i class="bi bi-check-circle"></i> Payment Complete';
                    payButton.style.background = '#28a745';
                }, 2000);

            } catch (error) {
                showResult('error', 'Payment failed: ' + error.message);
                payButton.innerHTML = '<i class="bi bi-lock-fill"></i> Pay €5.50';
                payButton.disabled = false;
            }
        }

        function testRefundFlow() {
            showResult('info', 'Refund flow would typically involve server-side API calls to process refunds through Stripe Connect');
        }

        function testWebhookFlow() {
            showResult('info', 'Webhook testing would verify payment confirmations and status updates from Stripe');
        }

        async function runFullStripeTest() {
            showResult('info', 'Starting comprehensive Stripe Connect test...');
            
            // Test 1: Connection
            await new Promise(resolve => setTimeout(resolve, 1000));
            await testStripeConnection();
            
            // Test 2: Payment Setup
            await new Promise(resolve => setTimeout(resolve, 1500));
            testPaymentFlow();
            
            // Test 3: Status
            await new Promise(resolve => setTimeout(resolve, 1000));
            showResult('success', '🎉 All Stripe Connect tests completed successfully!');
        }

        function showResult(type, message) {
            const resultsDiv = document.getElementById('testResults');
            const resultDiv = document.createElement('div');
            resultDiv.className = `result ${type}`;
            resultDiv.innerHTML = message;
            resultDiv.style.display = 'block';
            
            resultsDiv.appendChild(resultDiv);
            
            // Auto-remove after 10 seconds
            setTimeout(() => {
                if (resultDiv.parentNode) {
                    resultDiv.parentNode.removeChild(resultDiv);
                }
            }, 10000);
        }
    </script>
</body>
</html>
