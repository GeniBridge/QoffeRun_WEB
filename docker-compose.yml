# /srv/qofferun/docker-compose.yml

networks:
  traefik:
  internal:

volumes:
  pgdata:
  letsencrypt:

services:
  traefik:
    image: traefik:v3.0
    container_name: traefik
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=admin@qofferun.com
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks: [traefik]
    restart: unless-stopped

  # ---------- API (php-fpm + nginx) ----------
  backend:
    build:
      context: ./backend/docker
      dockerfile: Dockerfile
    image: qoffe-run-backend
    container_name: qoffe-run-backend
    volumes:
      - ./backend/src:/var/www/html
    expose:
      - "9000"                                # php-fpm on the internal network
    depends_on: [db]
    networks: [internal]
    restart: unless-stopped

  backend_web:
    image: nginx:alpine
    container_name: backend-web
    depends_on: [backend]
    volumes:
      - ./backend/src:/var/www/html:ro        # SAME path as php-fpm
      - ./backend/nginx-backend.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=qofferun_traefik"   # <-- match actual Docker network name
      - "traefik.http.routers.api.rule=Host(`api.qofferun.com`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=80"
    networks: [traefik, internal]
    restart: unless-stopped

  # ---------- Frontends ----------
  bar_frontend:
    image: nginx:alpine
    container_name: bar-frontend
    volumes:
      - ./frontend-bar-panel/dist:/usr/share/nginx/html:ro
      - ./nginx-spa.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=qofferun_traefik"
      - "traefik.http.routers.bar.rule=Host(`bar.qofferun.com`)"
      - "traefik.http.routers.bar.entrypoints=websecure"
      - "traefik.http.routers.bar.tls.certresolver=letsencrypt"
      - "traefik.http.services.bar.loadbalancer.server.port=80"
    networks: [traefik]
    restart: unless-stopped

  controllo_frontend:
    image: nginx:alpine
    container_name: controllo-frontend
    volumes:
      - ./frontend-admin-panel/build:/usr/share/nginx/html:ro
      - ./nginx-admin.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=qofferun_traefik"
      - "traefik.http.routers.controllo.rule=Host(`controllo.qofferun.com`)"
      - "traefik.http.routers.controllo.entrypoints=websecure"
      - "traefik.http.routers.controllo.tls.certresolver=letsencrypt"
      - "traefik.http.services.controllo.loadbalancer.server.port=80"
    networks: [traefik]
    restart: unless-stopped

  portal_frontend:
    image: nginx:alpine
    container_name: portal-frontend
    volumes:
      - ./frontend-portal/build:/usr/share/nginx/html:ro
      - ./nginx-spa.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=qofferun_traefik"
      - "traefik.http.routers.root.rule=Host(`qofferun.com`) || Host(`www.qofferun.com`)"
      - "traefik.http.routers.root.entrypoints=websecure"
      - "traefik.http.routers.root.tls.certresolver=letsencrypt"
      - "traefik.http.services.root.loadbalancer.server.port=80"
    networks: [traefik]
    restart: unless-stopped

  # ---------- DB & Admin ----------
  pgadmin:
    image: dpage/pgadmin4
    container_name: qoffe-run-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@qofferun.com
      PGADMIN_DEFAULT_PASSWORD: change_me_now
      PGADMIN_LISTEN_PORT: 80
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=qofferun_traefik"      # make Traefik hit the right network
      - "traefik.http.routers.pgadmin.rule=Host(`db.qofferun.com`)"
      - "traefik.http.routers.pgadmin.entrypoints=websecure"
      - "traefik.http.routers.pgadmin.tls.certresolver=letsencrypt"
      - "traefik.http.services.pgadmin.loadbalancer.server.port=80"
    networks: [traefik, internal]
    restart: unless-stopped

  db:
    image: postgres:15
    container_name: qoffe-run-db
    restart: always
    environment:
      POSTGRES_DB: qoffe_run
      POSTGRES_USER: qoffeuser
      POSTGRES_PASSWORD: qoffe2025
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
