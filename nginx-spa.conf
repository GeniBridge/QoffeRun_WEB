server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # JavaScript files
    location ~* \.js$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # CSS files  
    location ~* \.css$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy to backend
    location /api/ {
        proxy_pass https://api.qofferun.com/api/;
        proxy_set_header Host api.qofferun.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_verify off;
    }

    # Mobile app subdirectory
    location /mobile/ {
        alias /srv/qofferun/mobile-expo/build/;
        try_files $uri $uri/ /mobile/index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Prevent caching of HTML
        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "Thu, 01 Jan 1970 00:00:01 GMT";
        }
    }

    # Single Page App: history API fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aggressive cache prevention for all HTML files
    location ~* \.(html)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "Thu, 01 Jan 1970 00:00:01 GMT";
        add_header X-Build-Version "modern-ui-v3";
    }
    
    # Root path cache busting
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "Thu, 01 Jan 1970 00:00:01 GMT";
        try_files $uri $uri/ /index.html;
    }

    # Static files long cache
    location /static/ {
        alias /usr/share/nginx/html/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Images / icons
    location ~* \.(ico|png|jpg|jpeg|gif|svg)$ {
        expires 1y;
        add_header Cache-Control "public";
    }

    # Assets folder
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Logs (inside container)
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
