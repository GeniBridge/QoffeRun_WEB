<!-- QoffeRun Logo SVG -->
<svg width="300" height="100" viewBox="0 0 300 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="40" fill="#FF6B35" stroke="#FFF" stroke-width="2"/>
  
  <!-- Coffee cup -->
  <g transform="translate(30, 25)">
    <!-- Cup body -->
    <path d="M10 20 L10 35 Q10 40 15 40 L25 40 Q30 40 30 35 L30 20 Z" fill="#FFF"/>
    <!-- Handle -->
    <path d="M30 25 Q35 25 35 30 Q35 35 30 35" stroke="#FFF" stroke-width="2" fill="none"/>
    <!-- Steam -->
    <path d="M15 18 Q16 15 15 12" stroke="#FFF" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M20 18 Q21 15 20 12" stroke="#FFF" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M25 18 Q26 15 25 12" stroke="#FFF" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  
  <!-- Text -->
  <text x="110" y="45" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#FF6B35">
    Qoffe
  </text>
  <text x="200" y="45" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#333">
    Run
  </text>
  
  <!-- Tagline -->
  <text x="110" y="70" font-family="Arial, sans-serif" font-size="12" fill="#666">
    Gestione Smart per Catene di Bar
  </text>
</svg>