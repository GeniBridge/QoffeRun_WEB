<!DOCTYPE html>
<html>
<head>
    <title>Google Maps API Debug Test</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>Google Maps API Debug Test</h1>
    
    <div>
        <h2>1. API Key Test</h2>
        <p>API Key: <span id="apiKey">Loading...</span></p>
        <p>Domain: <span id="domain"></span></p>
        <p>Referrer: <span id="referrer"></span></p>
    </div>

    <div>
        <h2>2. Script Loading Test</h2>
        <p>Google object: <span id="googleObj">No</span></p>
        <p>Maps API: <span id="mapsAPI">No</span></p>
        <p>Places API: <span id="placesAPI">No</span></p>
    </div>

    <div>
        <h2>3. Error Console</h2>
        <div id="errors" style="background: #f0f0f0; padding: 10px; min-height: 100px; font-family: monospace;"></div>
    </div>

    <div>
        <h2>4. Direct API Test</h2>
        <input type="text" id="addressInput" placeholder="Type an address..." style="width: 300px; padding: 5px;">
        <p id="autocompleteStatus">Autocomplete not initialized</p>
    </div>

    <script>
        // Setup error logging
        const errorDiv = document.getElementById('errors');
        const originalConsoleError = console.error;
        const originalConsoleLog = console.log;
        
        function logMessage(type, ...args) {
            const message = args.join(' ');
            errorDiv.innerHTML += `[${type.toUpperCase()}] ${new Date().toISOString()}: ${message}\n`;
        }
        
        console.error = function(...args) {
            logMessage('ERROR', ...args);
            originalConsoleError.apply(console, args);
        };
        
        console.log = function(...args) {
            logMessage('LOG', ...args);
            originalConsoleLog.apply(console, args);
        };

        // Setup global error handler for Google Maps
        window.gm_authFailure = function() {
            console.error('Google Maps authentication failure detected!');
            document.getElementById('errors').innerHTML += '[AUTH FAILURE] Google Maps authentication failed - check API key and domain restrictions\n';
        };

        // Display basic info
        document.getElementById('domain').textContent = window.location.hostname;
        document.getElementById('referrer').textContent = document.referrer || 'None';

        async function loadAPIKey() {
            try {
                console.log('Loading API key from backend...');
                const response = await fetch('https://api.qofferun.com/api/v1/settings/public/google_maps');
                const data = await response.json();
                
                console.log('Backend response:', data);
                document.getElementById('apiKey').textContent = data.api_key ? 
                    data.api_key.substring(0, 15) + '...' : 'Not found';
                
                return data.api_key;
            } catch (error) {
                console.error('Failed to load API key:', error);
                document.getElementById('apiKey').textContent = 'Error loading';
                return null;
            }
        }

        async function loadGoogleMaps() {
            const apiKey = await loadAPIKey();
            if (!apiKey) {
                console.error('No API key available');
                return;
            }

            console.log('Loading Google Maps with key:', apiKey.substring(0, 10) + '...');
            
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = `https://maps.googleapis.com/maps/api/js?key=${apiKey}&libraries=places&language=it&region=IT&callback=onGoogleMapsLoaded`;
                script.async = true;
                script.defer = true;
                
                window.onGoogleMapsLoaded = function() {
                    console.log('Google Maps callback executed');
                    updateStatus();
                    resolve();
                };
                
                script.onerror = function(event) {
                    console.error('Script loading error:', event);
                    reject(event);
                };
                
                document.head.appendChild(script);
            });
        }

        function updateStatus() {
            document.getElementById('googleObj').textContent = window.google ? 'Yes' : 'No';
            document.getElementById('mapsAPI').textContent = window.google?.maps ? 'Yes' : 'No';
            document.getElementById('placesAPI').textContent = window.google?.maps?.places ? 'Yes' : 'No';
            
            // Test autocomplete
            if (window.google?.maps?.places?.Autocomplete) {
                try {
                    const input = document.getElementById('addressInput');
                    const autocomplete = new google.maps.places.Autocomplete(input, {
                        types: ['address'],
                        componentRestrictions: { country: 'IT' }
                    });
                    document.getElementById('autocompleteStatus').textContent = 'Autocomplete initialized successfully';
                    
                    autocomplete.addListener('place_changed', function() {
                        const place = autocomplete.getPlace();
                        console.log('Place selected:', place);
                    });
                } catch (error) {
                    console.error('Autocomplete initialization error:', error);
                    document.getElementById('autocompleteStatus').textContent = 'Autocomplete error: ' + error.message;
                }
            } else {
                document.getElementById('autocompleteStatus').textContent = 'Autocomplete API not available';
            }
        }

        // Start the test
        loadGoogleMaps().catch(error => {
            console.error('Failed to load Google Maps:', error);
        });
        
        // Check status periodically
        setInterval(updateStatus, 1000);
    </script>
</body>
</html>
